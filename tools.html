<style>
/* ===== vjvc v4: editorial night ===== */
:root{--bg:#0D0918;--bg2:#120D24;--surf:#171030;--surf2:#1F1740;--text:#EFEAFB;--ink:#EFEAFB;--dk:#150F2B;--muted:#9E96BE;--line:rgba(239,234,251,.11);--line2:rgba(239,234,251,.22);--edge:rgba(239,234,251,.24);--edge-soft:rgba(239,234,251,.12);--sh:transparent;--pink:#8B6CFF;--pink-soft:#B8A6FF;--blue:#6CCBF5;--rose:#FF9EC4;--peach:#FFD0A6;--sun:#FFD166;--mint:#7BE0B0;--surface:#171030;--radius:16px;color-scheme:dark}
html{scrollbar-color:#3A2D78 var(--bg);scroll-behavior:smooth}
html[lang] body,body{font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--text);animation:none;padding-bottom:100px;background:radial-gradient(70% 45% at 12% -5%,rgba(139,108,255,.2),transparent 70%),radial-gradient(50% 35% at 100% 10%,rgba(255,158,196,.08),transparent 70%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:5px;z-index:60;pointer-events:none;background:linear-gradient(#5CC8F5 0 20%,#F5A9B8 20% 40%,#fff 40% 60%,#F5A9B8 60% 80%,#5CC8F5 80%)}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
::selection{background:var(--pink);color:#fff}
.page{padding-top:36px}
h1,h2,.big,.msg,.num-screen{font-family:Fraunces,Georgia,serif;font-weight:600;font-variation-settings:"opsz" 144;font-variant-numeric:tabular-nums}
h1{font-size:clamp(48px,9vw,96px);line-height:1;letter-spacing:-.03em}
h2{letter-spacing:-.01em}
.head h2,.apps-head h2,.freelance-top h2,.arcade-top h2{font-size:26px}
.gradient-text{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--pink-soft);font-style:italic;animation:none;text-shadow:none}
.copyright{opacity:1;color:var(--muted)}
.home-link{color:var(--text);border-bottom:1px solid var(--line2)}
.home-link:hover{color:var(--pink-soft);border-color:var(--pink-soft)}
.stat,.status,.card-tag,.app-tag,.snap-label,.chip,.freelance-chip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== tools page ===== */
[hidden]{display:none!important}
input[type=checkbox],input[type=range],input[type=radio]{accent-color:var(--pink)}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.head{margin:0 4px 22px}
.head p{color:var(--muted);margin-top:8px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--edge);color:var(--ink);background:var(--surf);border-radius:999px;font-family:inherit;transition:transform .12s,box-shadow .12s}
.pill-btn:hover{transform:translate(-1px,-1px);}
.pill-btn svg{width:14px;height:14px}
.pill-btn .flip,html[dir=rtl] .pill-btn svg{transform:scaleX(-1)}
.lang-toggle{margin-inline-start:auto}
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.menu,.stage{background:var(--surf);border:1px solid var(--edge);border-radius:26px;backdrop-filter:none;min-width:0}
.menu{position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;padding:14px}
.stage{padding:24px}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--edge);border-radius:12px;background:var(--surf2)}
.search svg{width:16px;height:16px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);padding:11px 0;font:inherit;font-size:14px;box-shadow:none}
.search kbd{font:inherit;font-size:11px;padding:1px 7px;border-radius:6px;border:1px solid var(--edge);color:var(--muted);background:none}
.menu-list{display:flex;flex-direction:column;gap:4px}
.menu-list>*{display:flex;align-items:center;gap:11px;padding:8px 10px;border:1px solid transparent;border-radius:14px;background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-align:start;cursor:pointer;text-decoration:none;transition:background .12s}
.menu-list>*:hover{background:rgba(124,77,255,.2)}
.menu-list>.on,.menu-list>.active,.menu-list>[aria-current]{background:var(--pink);color:#fff;border-color:var(--edge);}
.menu-list .mi-ic{width:34px;height:34px;border-radius:10px}
.menu-list>*:nth-child(3n+2) .mi-ic{background:var(--rose)}
.menu-list>*:nth-child(3n) .mi-ic{background:var(--sun)}
.menu-foot{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:12.5px}
.menu-foot svg{width:16px;height:16px;flex:none;color:var(--mint)}
.mi-ic{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:13px;background:var(--blue);color:var(--dk);border:1px solid var(--edge);box-shadow:none}
.mi-ic svg{width:60%;height:60%}
.tool-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.tool-head h2{font-size:21px;margin:0}
.tool-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.hub-top{color:var(--muted);margin:0 2px 16px;line-height:1.8}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.hub-grid>*{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:18px;background:var(--surf2);border:1px solid var(--edge);border-radius:18px;color:var(--ink);font:inherit;text-align:start;text-decoration:none;cursor:pointer;transition:transform .12s,box-shadow .12s}
.hub-grid>*:hover{transform:translate(-2px,-2px);}
.hub-grid .mi-ic{width:42px;height:42px}
.hub-grid>*:nth-child(3n+2) .mi-ic{background:var(--rose)}
.hub-grid>*:nth-child(3n) .mi-ic{background:var(--sun)}
.hub-grid h3{font-size:16px;margin:0}
.hub-grid p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;align-items:start}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel{display:flex;flex-direction:column;gap:16px;padding:18px;background:var(--surf2);border:1px solid var(--edge);border-radius:18px;box-shadow:none;min-width:0}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.lbl,.field label{font-size:13px;font-weight:700;color:var(--ink)}
.field>label:has(output){display:flex;align-items:center}
.field label output{margin-inline-start:auto;font-family:"IBM Plex Mono",monospace;color:var(--pink-soft)}
.hint{margin:0;color:var(--muted);font-size:12.5px;line-height:1.75}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.inp{width:100%;padding:11px 13px;background:var(--surf);border:1px solid var(--edge);border-radius:12px;color:var(--ink);font:inherit;font-size:14px;color-scheme:dark;transition:box-shadow .12s}
.inp:focus{outline:none;box-shadow:0 0 0 3px var(--blue)}
.inp::placeholder{color:rgba(241,238,252,.35)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.7}
#j-in,#j-out,#b-in,#b-out{min-height:300px}
select.inp option{background:var(--surf);color:var(--ink)}
.range{width:100%}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;color:var(--ink)}
.check input{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);background:var(--surf);border:1px solid var(--edge);border-radius:12px;filter:none;text-decoration:none;transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{transform:translate(-1px,-1px);background:rgba(124,77,255,.28)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.primary{background:var(--pink);color:#fff;border-color:var(--edge)}
.btn.primary:hover{background:#8F66FF;filter:none}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:10px;}
.btn:disabled{opacity:.4;box-shadow:none;transform:none;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;padding:0;border:0;background:none;box-shadow:none}
.seg button{padding:7px 14px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:var(--surf);border:1px solid var(--edge);border-radius:999px;cursor:pointer;transition:background .12s}
.seg button:hover{background:rgba(124,77,255,.28)}
.seg button.on{background:var(--pink);color:#fff;border-color:var(--edge);}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding:0;border:0;background:none}
.tabs button{padding:8px 18px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--surf);border:1px solid var(--edge);border-radius:12px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.tabs button:hover{transform:translate(-1px,-1px)}
.tabs button.on{background:var(--pink);color:#fff;box-shadow:none;transform:translate(2px,2px)}
.drop{display:grid;place-items:center;gap:6px;padding:30px 20px;text-align:center;color:var(--ink);background:rgba(124,77,255,.1);border:1px dashed var(--edge);border-radius:18px;cursor:pointer;transition:background .12s}
.drop:hover,.drop:focus-visible,.drop.over,.drop.drag,.drop.on{background:rgba(124,77,255,.28);border-style:solid}
.drop svg{width:34px;height:34px;color:var(--pink-soft)}
.drop small{color:var(--muted)}
.files{display:flex;flex-direction:column;gap:8px}
.files>*{padding:9px 12px;background:var(--surf);border:1px solid var(--edge);border-radius:12px}
.sum{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--surf);border:1px solid var(--edge);border-radius:14px}
.status{display:flex;align-items:center;gap:8px;padding:9px 13px;font-size:13px;border-radius:12px;background:var(--surf);border:1px solid var(--edge);color:var(--muted)}
.status:empty{display:none}
.status.ok{background:rgba(111,216,168,.14);border-color:var(--mint);color:#BFF2D9}
.status.err,.status.bad,.status.error{background:rgba(255,125,125,.14);border-color:#FF7D7D;color:#FFC4C4}
.status.warn{background:rgba(255,209,102,.14);border-color:var(--sun);color:#FFE7A8}
.stat{display:inline-flex;padding:6px 12px;font-size:12.5px;border:1px solid var(--edge);border-radius:999px;background:var(--surf);color:var(--ink)}
.pw{padding:16px;font-family:"IBM Plex Mono",monospace;font-size:19px;line-height:1.6;word-break:break-all;background:var(--surf);border:1px solid var(--edge);border-radius:14px;color:var(--ink)}
.meter{height:12px;overflow:hidden;border-radius:99px;background:rgba(241,238,252,.12);border:1px solid var(--edge)}
.qr-stage{display:grid;place-items:center;padding:14px;background:#fff;border:1px solid var(--edge);border-radius:16px}
.qr-stage canvas{max-width:100%;height:auto}
.video-box{position:relative;display:grid;place-items:center;min-height:240px;overflow:hidden;background:#0B0718;border:1px solid var(--edge);border-radius:14px}
.video-box video{width:100%;display:block}
.binbox{display:grid;place-items:center;gap:8px;padding:20px;text-align:center}
.color-in input[type=color]{width:100%;height:42px;padding:3px;background:var(--surf);border:1px solid var(--edge);border-radius:12px;cursor:pointer}
.pr-pick{display:grid;gap:12px}.pr-grp{display:grid;gap:7px}
.pr-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pr-price{font-family:Fraunces,"IBM Plex Mono",monospace;font-size:clamp(26px,5vw,42px);font-weight:800;line-height:1.2}
.pr-chg{margin-top:4px;font-weight:700}
.pr-stats{display:flex;flex-wrap:wrap;gap:8px}
.pr-chart{position:relative;padding:10px;background:#0B0718;border:1px solid var(--edge);border-radius:14px}
.pr-tip{background:var(--surf2);color:var(--ink);border:1px solid var(--edge);border-radius:10px;padding:6px 10px;font-size:12.5px}
.units{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:end}
.swap{display:grid;place-items:center;width:42px;height:42px;margin-bottom:2px;color:#fff;background:var(--pink);border:1px solid var(--edge);border-radius:50%;cursor:pointer;transition:transform .12s}
.swap:hover{transform:rotate(180deg)}
.swap svg{width:18px;height:18px}
.big-out{display:flex;align-items:center;word-break:break-all}
.table{overflow:hidden;background:var(--surf);border:1px solid var(--edge);border-radius:14px}
.table>*{padding:9px 14px;border-bottom:1px dashed var(--line)}
.table>*:last-child{border-bottom:0}
.toast{background:var(--surf2);color:var(--ink);border:1px solid var(--edge);border-radius:12px}
@media(max-width:860px){.shell,.split,.split.even{grid-template-columns:minmax(0,1fr)}.menu{position:static}.menu-list{flex-direction:row;flex-wrap:wrap}.stage{padding:16px}.units{grid-template-columns:minmax(0,1fr)}.swap{justify-self:center}}

.btn.primary,.seg button.on,.tabs button.on,.menu-list>.on,.menu-list>.active,.menu-list>[aria-current],.swap{background:var(--text);color:var(--dk);border-color:transparent}
.btn.primary:hover{background:#fff}
.tabs button.on{transform:none}
.btn:hover,.seg button:hover,.menu-list>*:hover{background:rgba(255,255,255,.07)}
.mi-ic{background:rgba(139,108,255,.16);color:var(--pink-soft);border:1px solid rgba(139,108,255,.38)}
.menu-list>*:nth-child(3n+2) .mi-ic,.hub-grid>*:nth-child(3n+2) .mi-ic{background:rgba(255,158,196,.14);color:var(--rose);border-color:rgba(255,158,196,.38)}
.menu-list>*:nth-child(3n) .mi-ic,.hub-grid>*:nth-child(3n) .mi-ic{background:rgba(255,208,166,.14);color:var(--peach);border-color:rgba(255,208,166,.38)}
.hub-grid>*:hover{transform:translateY(-2px);border-color:var(--pink-soft)}
.toast{box-shadow:0 12px 32px rgba(0,0,0,.45)}
.toast{bottom:88px !important}

.dock{position:fixed;inset-inline:0;bottom:max(14px,env(safe-area-inset-bottom));z-index:55;display:flex;justify-content:center;pointer-events:none}
.dock nav{pointer-events:auto;display:flex;gap:2px;padding:5px;background:rgba(23,16,48,.94);border:1px solid var(--line2);border-radius:999px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.dock a{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;transition:background .12s,color .12s}
.dock a:hover{background:rgba(255,255,255,.08);color:var(--text)}
.dock a[aria-current="page"]{background:var(--text);color:var(--dk)}
.dock svg{width:16px;height:16px;flex:none}
@media(max-width:560px){.dock a{padding:10px 12px}.dock a:not([aria-current="page"]) span{display:none}}
@media(prefers-reduced-motion:reduce){.hero>*{animation:none}}

.skip{position:fixed;inset-inline-start:12px;top:-70px;z-index:70;padding:10px 16px;background:var(--pink);color:#fff;border-radius:12px;font-weight:700;text-decoration:none;transition:top .15s}
.skip:focus{top:20px}
.nojs{margin:0 0 16px;padding:12px 16px;border:2px dashed var(--sun);border-radius:14px;color:var(--sun);text-align:center}
#lang-toggle,.lang-toggle{display:none !important}
.dock{transition:transform .25s ease}.dock.away{transform:translateY(170%)}
#vibe-status[role="button"]{cursor:pointer;transition:border-color .12s}
#vibe-status[role="button"]:hover{border-color:var(--edge)}
@media print{body::before,.dock,.skip{display:none}body{background:#fff;color:#000}}
@media(prefers-reduced-motion:reduce){.dock,.skip{transition:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
  <main class="page" id="main"><noscript><p class="nojs">This page needs JavaScript to run.</p></noscript>
    <div class="topbar">
      <a class="pill-btn" href="index.html">
        <svg class="flip" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        <span data-i="back"></span>
      </a>
      <button type="button" class="pill-btn lang-toggle" id="lang-toggle" aria-label="Switch language"><span class="lt-pill"></span><span class="lt-o" data-l="en">EN</span><span class="lt-o" data-l="fa">فا</span></button>
    </div>

    <div class="head">
      <h1><span class="gradient-text" data-i="title"></span></h1>
      <p data-i="sub"></p>
    </div>

    <div class="shell">
      <aside class="menu" aria-label="Tools">
        <div class="search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input type="search" id="q" data-ph="search" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </div>
        <nav class="menu-list" id="menu-list"></nav>
        <div class="menu-foot">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5 2.5 3.7v4c0 3.2 2.3 5.6 5.5 6.8 3.2-1.2 5.5-3.6 5.5-6.8v-4z"/><path d="m5.6 8 1.7 1.7L10.6 6.4"/></svg>
          <span data-i="private"></span>
        </div>
      </aside>

      <section class="stage" id="stage">
        <div class="view" id="v-hub">
          <p class="hub-top" data-i="hubIntro"></p>
          <div class="hub-grid" id="hub-grid"></div>
        </div>
        <div class="view" id="v-compress" hidden>
          <div class="tool-head"><span class="mi-ic" data-ic="compress"></span><div><h2 data-i="n_compress"></h2><p data-i="d_compress"></p></div></div>
          <div class="split">
            <div class="panel">
              <div class="field" id="c-qf"><span class="lbl" data-i="compression"></span>
                <div class="seg" id="c-lvl"><button type="button" data-v="0.9" data-i="lvBest"></button><button type="button" data-v="0.78" class="on" data-i="lvBal"></button><button type="button" data-v="0.55" data-i="lvSmall"></button></div>
                <p class="hint" data-i="lvNote"></p>
              </div>
              <p class="hint" id="c-pngn" data-i="pngNote" hidden></p>
              <div class="field"><span class="lbl" data-i="resize"></span>
                <div class="seg" id="c-rs"><button type="button" data-v="orig" class="on" data-i="rsOrig"></button><button type="button" data-v="fit" data-i="rsFit"></button><button type="button" data-v="pct" data-i="rsPct"></button></div>
